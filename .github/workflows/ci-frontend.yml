name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'front/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'front/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessary for SonarQube analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: ./front
        run: npm ci

      - name: Run Lint
        working-directory: ./front
        run: npm run lint

      - name: Run Tests with Coverage
        working-directory: ./front
        # We assume 'npm test' generates a coverage report at front/coverage/lcov.info
        run: npm test -- --coverage || echo "No tests defined yet"

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=BuildMarket_Frontend
            -Dsonar.sources=front/src
            -Dsonar.javascript.lcov.reportPaths=front/coverage/lcov.info
