# ============================================================
# BuildMarket — K8s Full Deployment & Services
# ============================================================

# ── DATABASE (MongoDB) ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:latest
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-storage
          mountPath: /data/db
      volumes:
      - name: mongo-storage
        persistentVolumeClaim:
          claimName: mongo-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  selector:
    app: mongodb
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017

# ── GEOMETRY SERVICE ────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: geometry-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: geometry
  template:
    metadata:
      labels:
        app: geometry
    spec:
      containers:
      - name: geometry
        image: your-docker-username/buildmarket-geometry:latest
        ports:
        - containerPort: 8008

---

apiVersion: v1
kind: Service
metadata:
  name: geometry-service
spec:
  selector:
    app: geometry
  ports:
    - protocol: TCP
      port: 8008
      targetPort: 8008

# ── BACKEND ──────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: your-docker-username/buildmarket-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: buildmarket-secrets
              key: MONGO_URI
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: buildmarket-secrets
              key: JWT_SECRET

---

apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

# ── FRONTEND ──────────────────────────────────────────────────
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: your-docker-username/buildmarket-frontend:latest
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
