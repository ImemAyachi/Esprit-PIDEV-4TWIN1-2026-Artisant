# ============================================================
# BuildMarket — SonarQube Configuration
# ============================================================

# Project metadata
sonar.projectKey=BuildMarket_Monorepo
sonar.projectName=BuildMarket
sonar.projectVersion=1.0

# Path to the source directories
# Note: In a monorepo, we include both services
sonar.sources=front/src,server/src

# Exclusions (tests, dependencies, artifacts)
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/*.test.js, **/*.test.jsx, server/uploads/**

# Path to test directories
sonar.tests=front/src,server/src
sonar.test.inclusions=**/*.test.js, **/*.test.jsx

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Coverage Reports
# Frontend (LCOV)
sonar.javascript.lcov.reportPaths=front/coverage/lcov.info

# Backend (Cobertura/Istanbul)
# Note: For multiple reports, use a comma-separated list
sonar.genericcoverage.unitTestReportPaths=server/coverage/test-report.xml
